[project]
name = "wgai"
version = "0.1.0"
description = "天天军棋·翻翻棋 AI 训练端：规则引擎/模拟器/训练/导出/评测"
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.18",
    "numpy>=1.26",
    "pillow>=10.0",
    "safetensors>=0.4",
    "msgspec>=0.18",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
coreml = [
    "coremltools>=9.0",
]

[project.scripts]
wgai = "wgai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wgai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
