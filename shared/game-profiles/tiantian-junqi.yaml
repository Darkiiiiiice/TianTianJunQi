# 天天军棋·翻翻棋 游戏配置（对应设计文档 §5 GameProfile）
# 标注"待实测"的字段由开发计划 P0 任务回填；P0 未完成前为占位值。

game: 天天军棋
mode: 翻翻棋

window:
  # P0-1 实测（2026-10-23，微信 4.x）：小游戏窗口由主微信进程持有，
  # WeChatAppEx 只负责渲染、名下无窗口；判定 = owner bundle 候选池 + 标题命中
  ownerBundleIDs: [com.tencent.xinWeChat, com.tencent.flue.WeChatAppEx]
  titleContains: [天天军棋]              # 实测标题"腾讯天天军棋"；需要屏幕录制权限
  minSize: { width: 240, height: 180 }   # 窗口可缩小到 368x251，不能卡 300 高
  observed:
    title: 腾讯天天军棋
    sizePt: 约960x540                    # 可随用户缩放，每次会话重新校验
    owner: com.tencent.xinWeChat
    contentForm: landscape-full          # 横版铺满窗口，无黑边
  canvasROI: { x: 0.0, y: 0.07, w: 1.0, h: 0.93 }   # 粗测：排除顶部约 40px 小程序标题栏（M1-1 校准精修）
  # 2026-10-23 实测：SCStream 抓帧按小程序原生画布输出（1920×1080），
  # 游戏内容只占左上角 928×608，其余是黑边。必须裁到内容区，
  # 否则预览有大片黑区、OCR 归一化坐标相对窗口整体偏移（点击落空）。
  capture:
    nativeCanvas: { width: 1920, height: 1080 }
    contentInCanvas: { x: 0.0, y: 0.0, w: 0.483, h: 0.563 }  # 运行时由 detectContentRect 动态检测
    contentDetect: rowColumnProfile                        # 行/列剖面找非黑内容区
  entry:                                 # P0-2 粗测：主菜单"翻翻棋"入口（蓝色大按钮，右侧）
    text: 翻翻棋                         # 艺术字，OCR 关键字用"翻棋"更稳
    normRect: { x: 0.52, y: 0.26, w: 0.33, h: 0.17 }  # 相对整窗归一化，粗测
    # OCR 漏识时的安全点击区：覆盖大/小窗口都能命中的按钮中心
    fallbackNormRect: { x: 0.55, y: 0.28, w: 0.34, h: 0.18 }
  # 2026-10-23 注入实测：postToPid 不移动指针，但微信小游戏忽略定向事件。
  # 采用全局 HID 点击 + 立即还原指针；点击前必须 AX raise、校验目标点最前窗口、
  # 重新读取窗口 bounds；目标出屏时用 AX 把窗口移回可见区域。
  clickPolicy:
    delivery: globalWithCursorRestore
    postToPidWorks: false
    preserveCursor: true
    respectUserInput: true
    requireAXRaise: true
    requireOnScreen: true
    moveWindowOnScreen: true
  venue:                                 # P0-4 实测：入口后是场次选择页，无单机/练习
    text: 新手场
    normRect: { x: 0.235, y: 0.184, w: 0.185, h: 0.673 }  # 绿卡整卡；OCR 用卡片文字中心
    alternatives: [普通场, 大师场]
    note: 点击场次卡立即开始匹配，没有"开始/确认"二次确认

board:
  rows: 5                              # P0-3 截图实测：5 行 × 12 列 = 60 格
  cols: 12
  piecesPerSide: 30                    # 开局满盘 60 枚（30/方）；逐类数量待清点
  theme: default                       # 待实测；校准文件记录 theme，不匹配则要求重新校准

opponent:
  default: quickMatch                  # P0-4 实测：无单机/练习，只能真人匹配
  aiPracticeEntryExists: false
  venue: 新手场                        # 新手场 / 普通场 / 大师场；点击即开始匹配
  autoContinueAI: false                # 无单机模式（保留字段供游戏后续版本）
  autoContinueHuman: true              # 用户 2026-10-23 显式选择：允许自动再来一局，无每日局数上限
  ticketCost: 50                       # 每局扣 50 金币（匹配页文案实测）
  matchTimeout: 120                    # 匹配等待上限（秒），超时暂停，不重复点击

actionSpace:
  # tap_cell 索引范围 0..rows*cols-1，由 board 推导，不单独配置
  buttons: [venue, again, switchOpponent, close, confirm] # P0-4 实测：无 start/人机按钮

flow:
  # P0-4 实测的界面链：main → venue → matching → board → result
  # 判据为 OCR 关键词；竖排文字需同时识别原图与逆时针旋转 90° 的画面
  # 分类优先级：popup > result > board > matching > venue > main
  # 小窗口先 2× 放大再 OCR；主菜单另用底部栏兜底（368×251 实测“翻翻棋”会漏识）
  screens:
    main: { keywords: [翻棋, 四国军棋, 排位赛, 每日签到, 免费抽奖, 大转盘, 任务, 布局, 商城] }
    venue: { keywords: [最低携带, 无限制, 新手场, 普通场, 大师场] }
    matching: { keywords: [正在匹配小伙伴, 匹配小伙伴, 每局扣除门票] }
    board: { keywords: [翻旗定阵营, 连续两次翻到同色, 最近翻旗, '第 N 步（正则）'] }
    result: { keywords: [再来一局, 切换对手, 战败, 战胜, 投降] }
    popup: { keywords: [游戏规则, 玩法规则, 布局规则, 吃子规则, 行走路线, 判负, 扣除, 确定要退出, 一键领取, 领取破产金, 破产金, 金币不足, 恭喜获得, 温馨提示] }
  resultActions: [再来一局, 切换对手]   # 两者都会重新进入真人匹配
  note: 无房卡/取消匹配按钮；匹配中只能等待或由用户手动退出；已知弹窗按 popups 目录自动关闭，未知弹窗/广告/实名/更新暂停并截图

popups:
  # M1-8 实测弹窗目录（v1）。列表之外的弹窗一律按未知处理：暂停 + 截图，绝不盲点。
  # 顺序即优先级：退出确认最先（误点「确定」会判负扣费），签到先于广告（签到弹层也含「看广告」文案）。
  maxCloseRounds: 3
  templates:
    exitConfirm:
      signatures: [确定要退出, 现在退出将被判负, 扣除双倍]
      closeKeywords: [取消]            # 只允许取消，绝不点「确定」
    signIn:
      signatures: [登录奖励, 本月累计签到, 累计签到]
      closeKeywords: [关闭, 取消]
      closeAnchor: popup.close.signIn
    task:
      signatures: [每日任务, 成长任务, 去完成]
      closeKeywords: [关闭, 取消]
      closeAnchor: popup.close.task
    profile:
      signatures: [个人信息, 游戏ID, 四国胜率]
      closeKeywords: [关闭, 取消]
      closeAnchor: popup.close.profile
    rules:
      signatures: [游戏规则, 玩法规则, 布局规则, 吃子规则, 行走路线]
      closeKeywords: [关闭, 我知道了, 知道了, 取消]
    announcement:
      signatures: [系统公告, 更新公告, 活动公告, 公告内容]
      closeKeywords: [关闭, 我知道了, 知道了, 取消]
    disconnect:
      signatures: [重新连接, 网络异常, 连接失败, 断线重连, 连接已断开]
      closeKeywords: [重新连接, 关闭, 取消]
    ad:
      signatures: [观看广告, 看广告, 广告奖励]
      pause: 广告弹窗按设计暂停，不自动观看/跳过
    realName:
      signatures: [实名认证, 防沉迷, 身份验证]
      pause: 实名/防沉迷提示需要人工处理
    update:
      signatures: [版本更新, 更新内容, 立即更新]
      pause: 版本更新弹窗不自动处理
  # 内置关闭锚点（相对整窗归一化，左上原点）；校准文件 buttons 同名 key 可覆盖。
  anchors:
    popup.close.signIn: { x: 0.795, y: 0.235, w: 0.080, h: 0.075 }
    popup.close.task: { x: 0.798, y: 0.273, w: 0.080, h: 0.077 }
    popup.close.profile: { x: 0.230, y: 0.200, w: 0.071, h: 0.076 }
    popup.close: null                  # 通用关闭点未校准时不可用，避免盲点
  observed:
    - 2026-10-28: 领取救济金/金币不足弹层（含「一键领取」「观看15秒广告」）未匹配已知模板 → 未知弹窗暂停并导出截图；广告类不自动处理。
    - 2026-10-28: 登录奖励弹层 → OCR 命中「登录奖励」后用 popup.close.signIn 关闭。


performance:
  # M1-9：动作链路（动作门槛）。界面切换的 OCR 不计入此预算。
  endToEndBudgetMs: 200
  stages:
    screenOCR: 120                     # 诊断预算
    screenClassify: 15
    boardClassify: 100
    boardState: 15
    tapDecision: 5
    tapClick: 60
  replayBenchmark:
    command: make perf
    lastRun: 2026-10-28
    samples: { board: 30, screen: 20 }  # 分别为 302 / 124 份中均匀抽样
    result: { p50Ms: 104.6, p95Ms: 146.9, maxMs: 153.1, passed: true }
    repeatRuns: { p95Ms: [112.0, 122.9, 146.9] }  # 高负载下 3 次回放
    boardStateAccuracy: 0.994
    boardPieceAccuracy: 0.972
    screenAccuracy: 0.80                # 20 份回放样本；训练留出集为 0.95
    environment: "Apple M1 Pro / 32GB / macOS 27.0.1 / load average 8–29（高负载，结果偏保守）"
    reportDir: perception/performance
    note: 端到端 = 棋盘分类 + 稳定投票 + GameState 构建 + 动作决策 + 30ms 注入前延迟；OCR 是界面切换路径，不参与动作门槛。

reward:
  win: 1.0
  loss: -1.0
  draw: 0.0
  captureValue: {}                     # 待实测 P0-5 后按棋子价值填充
  illegalActionPenalty: -0.1
  timeoutPenalty: 0.0
